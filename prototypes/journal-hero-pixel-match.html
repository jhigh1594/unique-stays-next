<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wayfinder Journal Hero Pixel Match</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600;1,9..144,700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      --w: 1606;
      --h: 979;
      --paper: #f1e7d6;
      --paper-shadow: rgba(9, 10, 10, 0.48);
      --cream: #f6f0e6;
      --muted-cream: rgba(246, 240, 230, 0.72);
      --peach: #e98f73;
      --button: #cf542d;
      --ink: #251f1b;
      --route-dark: rgba(0, 0, 0, 0.78);
      --route-light: rgba(246, 240, 230, 0.82);
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: #11100e;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      color: var(--cream);
    }

    body {
      display: grid;
      place-items: center;
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 0;
      background:
        radial-gradient(circle at 50% 35%, rgba(236, 218, 179, 0.08), transparent 38%),
        linear-gradient(180deg, #1f211f, #070807 72%);
    }

    .hero-wrap {
      width: min(100vw, calc(100vh * var(--w) / var(--h)));
      max-width: 1606px;
      aspect-ratio: 1606 / 979;
      position: relative;
      overflow: hidden;
      box-shadow: 0 28px 120px rgba(0, 0, 0, 0.55);
      background: #162127;
    }

    .hero {
      position: absolute;
      inset: 0;
      width: 1606px;
      height: 979px;
      transform-origin: top left;
      transform: scale(var(--stage-scale, 1));
      overflow: hidden;
      isolation: isolate;
    }

    .bg {
      position: absolute;
      inset: -18px;
      background:
        radial-gradient(ellipse at 72% 30%, rgba(28, 36, 35, 0.05), rgba(7, 12, 13, 0.16) 48%, rgba(3, 5, 5, 0.56) 100%),
        linear-gradient(90deg, rgba(8, 10, 10, 0.58) 0%, rgba(15, 21, 22, 0.32) 45%, rgba(14, 19, 19, 0.14) 100%),
        linear-gradient(180deg, rgba(13, 13, 12, 0.18) 0%, rgba(13, 17, 18, 0.22) 38%, rgba(5, 7, 7, 0.5) 100%),
        url("../public/prototypes/journal-hero-pixel-match/background.png") center / cover no-repeat;
      filter: saturate(0.9) brightness(0.86) contrast(1.06);
      transform: scale(1.025);
      z-index: 0;
    }

    .bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 33% 53%, rgba(238, 230, 208, 0.18), transparent 28%),
        radial-gradient(ellipse at 75% 15%, rgba(248, 222, 181, 0.12), transparent 20%),
        linear-gradient(180deg, rgba(4, 6, 6, 0.22), transparent 35%),
        linear-gradient(90deg, rgba(0, 0, 0, 0.32), transparent 58%);
      z-index: 1;
    }

    .forest {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(180deg, transparent 0 72%, rgba(7, 12, 8, 0.36) 92%),
        radial-gradient(ellipse at 18% 93%, rgba(95, 102, 28, 0.24), transparent 22%),
        radial-gradient(ellipse at 84% 86%, rgba(30, 57, 33, 0.32), transparent 18%);
      pointer-events: none;
    }

    .grain {
      position: absolute;
      inset: 0;
      z-index: 35;
      pointer-events: none;
      opacity: 0.08;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.86' numOctaves='5' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 180px 180px;
    }

    .copy {
      position: absolute;
      left: 114px;
      top: 58px;
      z-index: 10;
      width: 885px;
    }

    .eyebrow {
      margin: 0 0 26px;
      color: rgba(239, 230, 213, 0.72);
      font-size: 13px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 5.2px;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.34);
    }

    h1 {
      margin: 0;
      font-family: "Fraunces", Georgia, serif;
      font-size: 139px;
      line-height: 0.97;
      font-weight: 650;
      letter-spacing: -5px;
      color: var(--cream);
      text-shadow: 0 4px 22px rgba(0, 0, 0, 0.36);
    }

    h1 .accent {
      display: block;
      margin-top: -8px;
      padding-left: 25px;
      color: var(--peach);
      font-style: italic;
      font-weight: 650;
      letter-spacing: -4.5px;
    }

    .subcopy {
      width: 622px;
      margin: 34px 0 0;
      color: rgba(246, 240, 230, 0.78);
      font-size: 23px;
      line-height: 1.47;
      font-weight: 600;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.46);
    }

    .ctas {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 39px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 58px;
      border-radius: 999px;
      padding: 0 31px;
      text-decoration: none;
      font-size: 16px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.25px;
      color: #151312;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.18);
    }

    .btn.primary {
      min-width: 219px;
      background: var(--button);
    }

    .btn.secondary {
      min-width: 178px;
      color: rgba(12, 13, 13, 0.82);
      background: rgba(238, 238, 222, 0.06);
      border: 1.5px solid rgba(246, 240, 230, 0.34);
      backdrop-filter: blur(3px);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
    }

    .routes {
      position: absolute;
      inset: 0;
      z-index: 6;
      overflow: visible;
      pointer-events: none;
    }

    .routes path {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 5px;
      stroke-dasharray: 0.5 14;
      opacity: 0.9;
    }

    .route-light {
      stroke: var(--route-light);
    }

    .route-dark {
      stroke: var(--route-dark);
    }

    .polaroid {
      position: absolute;
      z-index: 14;
      background: linear-gradient(145deg, #f5ecdc 0%, #e8dcc7 100%);
      box-shadow:
        0 6px 14px rgba(10, 10, 8, 0.14),
        0 24px 45px rgba(8, 11, 11, 0.28);
      transform-origin: 50% 16%;
    }

    .polaroid::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 5;
      border: 1px solid rgba(91, 70, 48, 0.16);
      pointer-events: none;
      box-shadow: inset 0 0 34px rgba(126, 93, 44, 0.08);
    }

    .photo {
      position: absolute;
      overflow: hidden;
      background: #1f241c;
      box-shadow: inset 0 0 0 1px rgba(55, 41, 31, 0.1);
    }

    .photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(0.96) contrast(1.03) brightness(1.01);
    }

    .photo::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at center, transparent 57%, rgba(34, 20, 12, 0.16) 100%),
        linear-gradient(180deg, rgba(255, 231, 184, 0.07), transparent 42%);
      mix-blend-mode: multiply;
      pointer-events: none;
    }

    .caption {
      position: absolute;
      left: 30px;
      right: 30px;
      bottom: 17px;
      font-family: "Caveat", "Bradley Hand", cursive;
      color: rgba(66, 48, 36, 0.84);
      text-align: center;
      font-size: 21px;
      line-height: 0.86;
      font-weight: 400;
      letter-spacing: 0.1px;
    }

    .mark {
      position: absolute;
      color: rgba(66, 48, 36, 0.76);
      font-family: "Caveat", cursive;
      font-size: 35px;
      line-height: 1;
      font-weight: 400;
    }

    .pin {
      position: absolute;
      z-index: 22;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 28%, rgba(255, 104, 75, 0.96) 0 16%, transparent 18%),
        radial-gradient(circle at 48% 52%, #e12616 0 58%, #9b150c 100%);
      box-shadow:
        0 8px 9px rgba(0, 0, 0, 0.36),
        inset -3px -4px 4px rgba(105, 0, 0, 0.35);
    }

    .pin::after {
      content: "";
      position: absolute;
      left: 9px;
      top: 15px;
      width: 4px;
      height: 27px;
      background: linear-gradient(180deg, #631d15, rgba(30, 17, 12, 0));
      border-radius: 999px;
      transform: rotate(9deg);
      transform-origin: top center;
      z-index: -1;
      opacity: 0.84;
    }

    .pin.tiny {
      width: 19px;
      height: 19px;
    }

    .pin.bottom {
      width: 20px;
      height: 20px;
    }

    .lighthouse {
      left: 540px;
      top: 515px;
      width: 293px;
      height: 380px;
      transform: rotate(-6.1deg);
    }

    .lighthouse .photo {
      left: 31px;
      top: 24px;
      width: 234px;
      height: 298px;
    }

    .lighthouse .caption {
      bottom: 20px;
      transform: rotate(-4deg);
      font-size: 21px;
    }

    .lighthouse .mark {
      right: 37px;
      bottom: 27px;
    }

    .lighthouse-pin {
      left: 680px;
      top: 491px;
    }

    .treehouse {
      left: 873px;
      top: 310px;
      width: 295px;
      height: 366px;
      transform: rotate(-4deg);
    }

    .treehouse .photo {
      left: 22px;
      top: 18px;
      width: 249px;
      height: 287px;
    }

    .treehouse .caption {
      left: 39px;
      right: 39px;
      bottom: 20px;
      transform: rotate(-5deg);
      font-size: 20px;
    }

    .treehouse .mark {
      right: 34px;
      bottom: 21px;
      font-size: 31px;
      transform: rotate(22deg);
    }

    .treehouse-pin {
      left: 1015px;
      top: 287px;
    }

    .dome {
      left: 1220px;
      top: 92px;
      width: 313px;
      height: 413px;
      transform: rotate(5.6deg);
    }

    .dome .photo {
      left: 31px;
      top: 28px;
      width: 256px;
      height: 291px;
    }

    .dome .caption {
      bottom: 28px;
      font-size: 22px;
      line-height: 0.92;
      transform: rotate(-4deg);
    }

    .dome .mark {
      right: 40px;
      bottom: 25px;
      font-size: 34px;
      transform: rotate(-9deg);
    }

    .dome-pin {
      left: 1380px;
      top: 77px;
    }

    .route-pin-a {
      left: 424px;
      top: 809px;
    }

    .route-pin-b {
      left: 1179px;
      top: 194px;
    }

    .reference-toggle {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 50;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.86);
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      backdrop-filter: blur(8px);
      user-select: none;
      opacity: 0;
      transition: opacity 160ms ease;
    }

    .reference-toggle:hover,
    .reference-toggle:focus-within {
      opacity: 1;
    }

    .reference-toggle input {
      accent-color: var(--button);
    }

    .reference {
      position: absolute;
      inset: 0;
      z-index: 40;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
    }

    body:has(#show-reference:checked) .reference {
      opacity: 0.55;
    }

    body:has(#show-reference:checked) .grain {
      opacity: 0;
    }

    @media (max-aspect-ratio: 1606 / 979) {
      .hero-wrap {
        width: 100vw;
        height: calc(100vw * var(--h) / var(--w));
      }
    }

    @media (min-aspect-ratio: 1606 / 979) {
      .hero-wrap {
        height: 100vh;
        width: calc(100vh * var(--w) / var(--h));
      }
    }

    @media (max-width: 700px) {
      .page {
        align-items: start;
        padding-top: 34px;
      }

      .hero-wrap {
        width: 100vw;
        height: calc(100vw * 979 / 1606);
      }

      .reference-toggle {
        top: auto;
        right: 10px;
        bottom: 10px;
      }
    }
  </style>
</head>
<body>
  <label class="reference-toggle">
    <input id="show-reference" type="checkbox">
    Reference
  </label>

  <main class="page">
    <div class="hero-wrap">
      <section class="hero" aria-label="Wayfinder Journal hero prototype">
        <div class="bg" aria-hidden="true"></div>
        <div class="forest" aria-hidden="true"></div>

        <svg class="routes" viewBox="0 0 1606 979" aria-hidden="true">
          <path class="route-light" d="M 428 831 C 448 740, 504 706, 579 735 C 642 762, 705 778, 781 744 C 842 717, 870 651, 893 607" />
          <path class="route-dark" d="M 786 479 C 815 426, 863 431, 889 452 C 926 481, 900 532, 944 542 C 1009 556, 1044 492, 1056 452" />
          <path class="route-dark" d="M 1142 397 C 1114 330, 1139 245, 1191 223 C 1232 206, 1268 224, 1273 256" />
        </svg>

        <div class="copy">
          <p class="eyebrow">The Wayfinder Journal &middot; Vol. 2 &middot; 2026</p>
          <h1>
            <span>Slow mornings.</span>
            <span class="accent">Wild places.</span>
          </h1>
          <p class="subcopy">Stories from the extraordinary places we find &mdash; and the people brave enough to stay in them.</p>
          <div class="ctas" aria-label="Prototype calls to action">
            <a class="btn primary" href="#">Browse All Stories&#8594;</a>
            <a class="btn secondary" href="#">This week's pick</a>
          </div>
        </div>

        <article class="polaroid lighthouse" aria-label="Polaroid: where the wild meets the sea">
          <div class="photo">
            <img src="../public/prototypes/journal-hero-pixel-match/polaroid-lighthouse.png" alt="">
          </div>
          <div class="caption">where the wild<br>meets the sea</div>
          <div class="mark">&#9825;</div>
        </article>

        <article class="polaroid treehouse" aria-label="Polaroid: rooted in nature">
          <div class="photo">
            <img src="../public/prototypes/journal-hero-pixel-match/polaroid-treehouse.png" alt="">
          </div>
          <div class="caption">rooted in nature,<br>reaching for magic</div>
          <div class="mark">&#10087;</div>
        </article>

        <article class="polaroid dome" aria-label="Polaroid: wake up to wonder">
          <div class="photo">
            <img src="../public/prototypes/journal-hero-pixel-match/polaroid-dome.png" alt="">
          </div>
          <div class="caption">wake up to<br>wonder</div>
          <div class="mark">&#9825;</div>
        </article>

        <span class="pin lighthouse-pin" aria-hidden="true"></span>
        <span class="pin treehouse-pin" aria-hidden="true"></span>
        <span class="pin dome-pin" aria-hidden="true"></span>
        <span class="pin bottom route-pin-a" aria-hidden="true"></span>
        <span class="pin tiny route-pin-b" aria-hidden="true"></span>

        <div class="grain" aria-hidden="true"></div>
        <img class="reference" src="../public/prototypes/journal-hero-pixel-match/reference.png" alt="">
      </section>
    </div>
  </main>
  <script>
    const heroWrap = document.querySelector(".hero-wrap");
    const hero = document.querySelector(".hero");

    function syncStageScale() {
      const scale = heroWrap.clientWidth / 1606;
      hero.style.setProperty("--stage-scale", scale.toFixed(6));
    }

    syncStageScale();
    addEventListener("resize", syncStageScale, { passive: true });
  </script>
</body>
</html>
