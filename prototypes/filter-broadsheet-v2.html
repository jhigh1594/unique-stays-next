<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Collection — Unique Stays</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --terracotta: #A84626;
  --cream: #F7F3EC;
  --forest: #1E5F3A;
  --charcoal: #2E2A26;
  --sand: #E0D8C8;
  --muted: #8A7E72;
  --paper: #F7F3EC;
}

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--paper);
  color: var(--charcoal);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* Grain overlay */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
  opacity: 0.03;
  mix-blend-mode: multiply;
  z-index: 9999;
  background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

.container {
  max-width: 1080px;
  margin: 0 auto;
  padding: 2.5rem 1.5rem 4rem;
}

/* ── 1. Masthead ── */
.masthead {
  display: flex;
  align-items: baseline;
  gap: 1rem;
  margin-bottom: 1.75rem;
}

.masthead-title {
  font-family: 'Fraunces', serif;
  font-size: 2.5rem;
  font-weight: 400;
  color: var(--charcoal);
  white-space: nowrap;
  letter-spacing: -0.01em;
}

.masthead-rule {
  flex: 1;
  height: 1.5px;
  background: var(--terracotta);
  align-self: center;
  margin-top: -0.3rem;
}

.masthead-count {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--terracotta);
  white-space: nowrap;
  margin-top: -0.3rem;
}

/* ── 2. Search Field ── */
.search-wrap {
  position: relative;
  margin-bottom: 1.5rem;
}

.search-compass {
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 14px;
  height: 14px;
  color: var(--terracotta);
  transition: transform 0.3s ease;
}

.search-compass.active {
  transform: translateY(-50%) rotate(45deg);
}

.search-input {
  width: 100%;
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 1rem;
  color: var(--charcoal);
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--sand);
  padding: 0.5rem 0 0.5rem 22px;
  outline: none;
  transition: border-color 0.2s, border-width 0.2s;
}

.search-input::placeholder {
  color: var(--muted);
}

.search-input:focus {
  border-bottom: 2px solid var(--terracotta);
}

.search-clear {
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  font-size: 1.1rem;
  color: var(--muted);
  cursor: pointer;
  padding: 4px 2px;
  display: none;
  line-height: 1;
}

.search-clear.visible { display: block; }
.search-clear:hover { color: var(--terracotta); }

/* ── 3. Category Index ── */
.category-index {
  display: flex;
  align-items: baseline;
  gap: 0;
  overflow-x: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
  padding-bottom: 0.25rem;
  margin-bottom: 1rem;
  white-space: nowrap;
}
.category-index::-webkit-scrollbar { display: none; }

.cat-item {
  display: inline-flex;
  align-items: baseline;
  gap: 0.3rem;
  cursor: pointer;
  padding: 0.25rem 0;
  position: relative;
  user-select: none;
}

.cat-item + .cat-item::before {
  content: ' \00B7 ';
  color: var(--muted);
  margin: 0 0.35rem;
  font-size: 0.8rem;
}

.cat-item .cat-label {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  transition: color 0.15s;
}

.cat-item .cat-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.6rem;
  color: var(--muted);
}

.cat-item.active .cat-label {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 0.75rem;
  text-transform: none;
  letter-spacing: 0;
  color: var(--charcoal);
  font-weight: 400;
}

.cat-item.active .cat-count {
  color: var(--charcoal);
}

.cat-item.active::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--terracotta);
}

.cat-item:hover:not(.active) .cat-label {
  color: var(--charcoal);
}

.cat-item:hover:not(.active)::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: var(--sand);
}

/* ── 4. Filter Sentence Line ── */
.filter-sentence {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0 0;
  margin-bottom: 1.5rem;
  font-size: 0.85rem;
  line-height: 2;
}

.filter-seg {
  display: inline-flex;
  align-items: baseline;
  cursor: pointer;
  padding: 0.2rem 0;
  position: relative;
  user-select: none;
  min-height: 44px;
  min-width: 44px;
}

.filter-seg-text {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.8rem;
  color: var(--muted);
  transition: color 0.15s;
}

.filter-seg.active .filter-seg-text {
  font-weight: 600;
  color: var(--terracotta);
}

.filter-seg:hover .filter-seg-text {
  color: var(--charcoal);
}

.filter-sep {
  color: var(--sand);
  margin: 0 0.45rem;
  font-size: 0.7rem;
  line-height: 2;
  user-select: none;
}

.filter-clear-all {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.7rem;
  color: var(--terracotta);
  text-decoration: underline;
  cursor: pointer;
  margin-left: 0.75rem;
  display: none;
  min-height: 44px;
  display: none;
  align-items: center;
}

.filter-clear-all.visible { display: inline-flex; }

.filter-badges {
  display: inline-flex;
  gap: 0.5rem;
  margin-left: auto;
  align-items: center;
}

.toggle-badge {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 0.2rem 0.5rem;
  cursor: pointer;
  user-select: none;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  transition: all 0.15s;
}

.toggle-badge.pick {
  color: var(--terracotta);
  border: 1px solid var(--terracotta);
}

.toggle-badge.pick.pressed {
  background: var(--terracotta);
  color: var(--cream);
}

.toggle-badge.new-badge {
  color: var(--forest);
  border: 1px solid var(--forest);
}

.toggle-badge.new-badge.pressed {
  background: var(--forest);
  color: var(--cream);
}

/* ── Location Combobox Popover ── */
.location-popover {
  position: absolute;
  top: calc(100% - 2px);
  left: 0;
  width: 280px;
  max-height: 320px;
  overflow-y: auto;
  background: var(--cream);
  border: 1px solid var(--sand);
  box-shadow: 0 4px 16px rgba(46,42,38,0.08);
  z-index: 100;
  display: none;
  scrollbar-width: thin;
}

.location-popover.open { display: block; }

.loc-search-wrap {
  position: relative;
  padding: 0.5rem;
  border-bottom: 1px solid var(--sand);
}

.loc-search-input {
  width: 100%;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.8rem;
  color: var(--charcoal);
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--sand);
  padding: 0.35rem 0;
  outline: none;
}

.loc-search-input::placeholder { color: var(--muted); }
.loc-search-input:focus { border-bottom-color: var(--terracotta); }

.loc-section-header {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  padding: 0.5rem 0.75rem 0.25rem;
}

.loc-item {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 0.35rem 0.75rem;
  cursor: pointer;
  transition: background 0.1s;
}

.loc-item:hover {
  background: rgba(168,70,38,0.06);
}

.loc-item.selected {
  background: rgba(168,70,38,0.08);
}

.loc-item-name {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.8rem;
  color: var(--charcoal);
}

.loc-item.selected .loc-item-name::before {
  content: '\2192 ';
  color: var(--terracotta);
}

.loc-item-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.6rem;
  color: var(--muted);
}

.loc-clear-item {
  padding: 0.4rem 0.75rem;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.7rem;
  color: var(--terracotta);
  cursor: pointer;
  border-top: 1px solid var(--sand);
}

.loc-empty {
  padding: 1rem 0.75rem;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.75rem;
  color: var(--muted);
  text-align: center;
}

/* ── Filter Popover (Price, Platform, Sleeps) ── */
.filter-popover {
  position: absolute;
  top: calc(100% - 2px);
  left: 0;
  min-width: 160px;
  background: var(--cream);
  border: 1px solid var(--sand);
  box-shadow: 0 4px 16px rgba(46,42,38,0.08);
  z-index: 100;
  display: none;
}

.filter-popover.open { display: block; }

.fp-item {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 0.35rem 0.75rem;
  cursor: pointer;
  transition: background 0.1s;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.8rem;
  color: var(--charcoal);
}

.fp-item:hover { background: rgba(168,70,38,0.06); }
.fp-item.selected { background: rgba(168,70,38,0.08); }
.fp-item.selected::before {
  content: '\2192 ';
  color: var(--terracotta);
}

/* ── 5. Result Cards ── */
.results-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2rem;
}

@media (max-width: 900px) {
  .results-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 580px) {
  .results-grid { grid-template-columns: 1fr; }
  .container { padding: 1.5rem 1rem 3rem; }
  .masthead-title { font-size: 1.6rem; }
}

.card {
  background: #fff;
  border-top: 8px solid #fff;
  border-left: 6px solid #fff;
  border-right: 6px solid #fff;
  border-bottom: 6px solid #fff;
  box-shadow: 0 1px 4px rgba(46,42,38,0.06);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  cursor: pointer;
}

.card:nth-child(3n+1) { transform: rotate(-1.5deg); }
.card:nth-child(3n+2) { transform: rotate(0.8deg); }
.card:nth-child(3n+3) { transform: rotate(-0.5deg); }

.card:hover {
  transform: translateY(-3px) rotate(0deg) !important;
  box-shadow: 0 6px 20px rgba(46,42,38,0.1);
}

.card-image {
  position: relative;
  width: 100%;
  aspect-ratio: 4/3;
  overflow: hidden;
}

.card-image-gradient {
  width: 100%;
  height: 100%;
}

.card-image-gradient.treehouses {
  background: linear-gradient(135deg, #2d5016 0%, #5a8a3c 40%, #8fb36a 100%);
}
.card-image-gradient.a-frames {
  background: linear-gradient(135deg, #4a6fa5 0%, #7b9cc7 40%, #b8cfe0 100%);
}
.card-image-gradient.geodomes {
  background: linear-gradient(135deg, #b85c2f 0%, #d4945a 40%, #ecc9a0 100%);
}
.card-image-gradient.cabins {
  background: linear-gradient(135deg, #6b4c3b 0%, #9b7b65 40%, #c4a98c 100%);
}
.card-image-gradient.yurts {
  background: linear-gradient(135deg, #8b6bb5 0%, #a88cc7 40%, #cbb8de 100%);
}

.card-category-stamp {
  position: absolute;
  top: 8px;
  left: 8px;
  border: 1px dashed var(--terracotta);
  padding: 0.1rem 0.35rem;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.55rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--terracotta);
  background: rgba(255,255,255,0.85);
  transform: rotate(-4deg);
}

.card-postmark {
  position: absolute;
  bottom: 10px;
  right: 10px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 2px solid var(--terracotta);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.5rem;
  font-weight: 700;
  color: var(--terracotta);
  background: rgba(255,255,255,0.85);
}

.card-postmark::before {
  content: '';
  position: absolute;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 1px dashed var(--terracotta);
  opacity: 0.5;
}

.card-pick-stamp {
  position: absolute;
  top: 8px;
  right: 8px;
  font-size: 0.75rem;
  color: var(--forest);
}

.card-body {
  padding: 0.65rem 0.5rem 0.35rem;
}

.card-title {
  font-family: 'Fraunces', serif;
  font-size: 1.05rem;
  font-weight: 400;
  color: var(--charcoal);
  margin-bottom: 0.15rem;
  line-height: 1.25;
}

.card-location {
  font-family: 'Caveat', cursive;
  font-size: 0.85rem;
  color: var(--muted);
  transform: rotate(-1.5deg);
  display: inline-block;
  margin-bottom: 0.3rem;
}

.card-meta {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.6rem;
  color: var(--muted);
  margin-bottom: 0.2rem;
}

.card-platform {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.6rem;
  color: var(--muted);
}

.platform-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  display: inline-block;
}

.platform-dot.airbnb { background: #FF5A5F; }
.platform-dot.vrbo { background: #3c6098; }
.platform-dot.wander { background: var(--forest); }
.platform-dot.direct { background: var(--terracotta); }

/* Card transitions */
.card.entering {
  opacity: 0;
  transform: scale(0.97);
}

.card.entered {
  opacity: 1;
  transform: scale(1);
  transition: opacity 180ms ease, transform 180ms ease;
}

.card.exiting {
  opacity: 0;
  transform: scale(0.97);
  transition: opacity 150ms ease, transform 150ms ease;
}

@media (prefers-reduced-motion: reduce) {
  .card, .card:hover, .card:nth-child(3n+1), .card:nth-child(3n+2), .card:nth-child(3n+3) {
    transition: none !important;
    transform: none !important;
  }
}

/* ── 7. Empty State ── */
.empty-state {
  text-align: center;
  padding: 5rem 1rem;
  display: none;
}

.empty-state.visible { display: block; }

.empty-title {
  font-family: 'Fraunces', serif;
  font-size: 4rem;
  color: var(--charcoal);
  font-weight: 400;
  margin-bottom: 0.5rem;
}

.empty-sub {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.85rem;
  color: var(--muted);
  margin-bottom: 1rem;
}

.empty-link {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.8rem;
  color: var(--terracotta);
  text-decoration: underline;
  cursor: pointer;
}

/* ── Mobile Bottom Sheet ── */
@media (max-width: 580px) {
  .location-popover,
  .filter-popover {
    position: fixed;
    top: auto;
    bottom: 0;
    left: 0;
    right: 0;
    width: 100%;
    max-height: 60vh;
    border: none;
    border-top: 1px solid var(--sand);
    border-radius: 0;
    box-shadow: 0 -4px 20px rgba(46,42,38,0.12);
    z-index: 200;
    transform: translateY(100%);
    transition: transform 0.3s ease;
  }

  .location-popover.open,
  .filter-popover.open {
    transform: translateY(0);
  }

  .bottom-sheet-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(46,42,38,0.3);
    z-index: 199;
  }

  .bottom-sheet-backdrop.open { display: block; }

  .sheet-handle {
    display: none;
  }

  @media (max-width: 580px) {
    .sheet-handle {
      display: block;
      width: 32px;
      height: 4px;
      background: var(--sand);
      border-radius: 2px;
      margin: 8px auto 4px;
    }
  }
}

.filter-sentence-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0;
}
</style>
</head>
<body>
<div class="container">

  <!-- 1. Masthead -->
  <header class="masthead">
    <span class="masthead-title">THE COLLECTION</span>
    <span class="masthead-rule"></span>
    <span class="masthead-count" id="stayCount">93 stays</span>
  </header>

  <!-- 2. Search Field -->
  <div class="search-wrap">
    <svg class="search-compass" id="compassIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" fill="currentColor" stroke="none"/>
    </svg>
    <input type="text" class="search-input" id="searchInput" placeholder="Search the collection&hellip;" autocomplete="off">
    <button class="search-clear" id="searchClear">&times;</button>
  </div>

  <!-- 3. Category Index -->
  <nav class="category-index" id="categoryIndex"></nav>

  <!-- 4. Filter Sentence Line -->
  <div class="filter-sentence" id="filterSentence">
    <div class="filter-sentence-row" id="filterRow"></div>
  </div>

  <!-- 5. Results Grid -->
  <div class="results-grid" id="resultsGrid"></div>

  <!-- 7. Empty State -->
  <div class="empty-state" id="emptyState">
    <div class="empty-title">Nothing here.</div>
    <div class="empty-sub">Try broadening your search.</div>
    <span class="empty-link" id="emptyReset">Start over</span>
  </div>

</div>

<!-- Bottom sheet backdrop for mobile -->
<div class="bottom-sheet-backdrop" id="backdrop"></div>

  { id: 4, title: "Lakeside Cabin", location: "Traverse City, MI", state: "Michigan", stateAbbr: "MI", region: "Midwest", category: "cabins", price: 175, rating: 4.7, sleeps: 6, platform: "Wander", editorsPick: false, isNew: true, tags: ["Lakefront", "Fire Pit"] },

  { id: 6, title: "Sequoia Treehouse", location: "Three Rivers, CA", state: "California", stateAbbr: "CA", region: "West", category: "treehouses", price: 380, rating: 4.95, sleeps: 2, platform: "Airbnb", editorsPick: true, isNew: false, tags: ["River Access", "Unique"] },

// ── Derived location data ──
function buildLocationData() {
  const stateMap = {};
  const cityMap = {};
  stays.forEach(s => {
    stateMap[s.state] = (stateMap[s.state] || 0) + 1;
    cityMap[s.location] = { count: (cityMap[s.location] || 0) + 1, state: s.stateAbbr };
  });
  const states = Object.entries(stateMap).map(([name, count]) => ({ name, count, type: 'state' })).sort((a,b) => a.name.localeCompare(b.name));
  const cities = Object.entries(cityMap).map(([name, data]) => ({ name, state: data.state, count: data.count, type: 'city' })).sort((a,b) => a.name.localeCompare(b.name));
  return { states, cities };
}

const locationData = buildLocationData();

// ── Filter state ──
const filters = {
  search: '',
  category: 'all',
  location: null, // { type: 'state'|'city', name: string, stateAbbr?: string }
  price: null,    // null | number (max price)
  priceLabel: null,
  platform: null,
  sleeps: null,
  editorsPick: false,
  isNew: false,
};

// ── Categories ──
const categories = ['all', 'treehouses', 'a-frames', 'geodomes', 'cabins', 'yurts'];

// ── Price options ──
const priceOptions = [
  { label: 'Any price', value: null },
  { label: 'Under $100', value: 100 },
  { label: 'Under $150', value: 150 },
  { label: 'Under $200', value: 200 },
  { label: 'Under $300', value: 300 },
  { label: 'Under $400', value: 400 },
];

// ── Platform options ──
const platformOptions = [
  { label: 'Any platform', value: null },
  { label: 'Airbnb', value: 'Airbnb' },
  { label: 'VRBO', value: 'VRBO' },
  { label: 'Wander', value: 'Wander' },
  { label: 'Direct', value: 'Direct' },
];

// ── Sleeps options ──
const sleepsOptions = [
  { label: 'Sleeps any', value: null },
  { label: 'Sleeps 2+', value: 2 },
  { label: 'Sleeps 4+', value: 4 },
  { label: 'Sleeps 6+', value: 6 },
];

// ── DOM refs ──
const $ = id => document.getElementById(id);
const stayCountEl = $('stayCount');
const searchInput = $('searchInput');
const searchClear = $('searchClear');
const compassIcon = $('compassIcon');
const categoryIndexEl = $('categoryIndex');
const filterRow = $('filterRow');
const resultsGrid = $('resultsGrid');
const emptyState = $('emptyState');
const emptyReset = $('emptyReset');
const backdrop = $('backdrop');

// ── Filtering ──
function getFilteredStays() {
  return stays.filter(s => {
    if (filters.search) {
      const q = filters.search.toLowerCase();
      const match = s.title.toLowerCase().includes(q)
        || s.location.toLowerCase().includes(q)
        || s.state.toLowerCase().includes(q)
        || s.tags.some(t => t.toLowerCase().includes(q));
      if (!match) return false;
    }
    if (filters.category !== 'all' && s.category !== filters.category) return false;
    if (filters.location) {
      if (filters.location.type === 'state' && s.state !== filters.location.name) return false;
      if (filters.location.type === 'city' && s.location !== filters.location.name) return false;
    }
    if (filters.price !== null && s.price > filters.price) return false;
    if (filters.platform && s.platform !== filters.platform) return false;
    if (filters.sleeps && s.sleeps < filters.sleeps) return false;
    if (filters.editorsPick && !s.editorsPick) return false;
    if (filters.isNew && !s.isNew) return false;
    return true;
  });
}

// ── Render categories ──
function renderCategories() {
  categoryIndexEl.innerHTML = '';
  categories.forEach(cat => {
    const el = document.createElement('span');
    el.className = 'cat-item' + (filters.category === cat ? ' active' : '');
    const count = cat === 'all'
      ? stays.length
      : stays.filter(s => s.category === cat).length;
    el.innerHTML = `<span class="cat-label">${cat === 'all' ? 'ALL' : cat.toUpperCase()}</span><span class="cat-count">${count}</span>`;
    el.addEventListener('click', () => {
      filters.category = cat;
      render();
    });
    categoryIndexEl.appendChild(el);
  });
}

// ── Active open popover tracking ──
let activePopover = null;
let activePopoverTrigger = null;

function closeAllPopovers() {
  document.querySelectorAll('.location-popover.open, .filter-popover.open').forEach(p => p.classList.remove('open'));
  backdrop.classList.remove('open');
  activePopover = null;
  activePopoverTrigger = null;
}

function isMobile() { return window.innerWidth <= 580; }

// ── Render filter sentence ──
function renderFilterSentence() {
  filterRow.innerHTML = '';

  // Location segment
  const locSeg = document.createElement('span');
  locSeg.className = 'filter-seg' + (filters.location ? ' active' : '');
  locSeg.style.position = 'relative';

  const locText = document.createElement('span');
  locText.className = 'filter-seg-text';
  if (filters.location) {
    locText.textContent = filters.location.type === 'city'
      ? `${filters.location.name.split(',')[0]}, ${filters.location.stateAbbr}`
      : filters.location.name;
  } else {
    locText.textContent = 'Everywhere';
  }
  locSeg.appendChild(locText);

  // Location clear x
  if (filters.location) {
    const locX = document.createElement('span');
    locX.textContent = ' ×';
    locX.style.color = 'var(--terracotta)';
    locX.style.marginLeft = '2px';
    locX.style.fontSize = '0.9rem';
    locX.style.cursor = 'pointer';
    locX.addEventListener('click', (e) => {
      e.stopPropagation();
      filters.location = null;
      closeAllPopovers();
      render();
    });
    locSeg.appendChild(locX);
  }

  // Location popover
  const locPopover = document.createElement('div');
  locPopover.className = 'location-popover';

  // Handle for mobile
  const handle = document.createElement('div');
  handle.className = 'sheet-handle';
  locPopover.appendChild(handle);

  // Search input
  const locSearchWrap = document.createElement('div');
  locSearchWrap.className = 'loc-search-wrap';
  const locSearchInput = document.createElement('input');
  locSearchInput.type = 'text';
  locSearchInput.className = 'loc-search-input';
  locSearchInput.placeholder = 'Search locations…';
  locSearchInput.autocomplete = 'off';
  locSearchWrap.appendChild(locSearchInput);
  locPopover.appendChild(locSearchWrap);

  // Results container
  const locResults = document.createElement('div');
  locPopover.appendChild(locResults);

  function renderLocResults(query) {
    locResults.innerHTML = '';
    const q = (query || '').toLowerCase();

    const matchedStates = locationData.states.filter(s => s.name.toLowerCase().includes(q));
    const matchedCities = locationData.cities.filter(c => c.name.toLowerCase().includes(q));

    if (matchedStates.length > 0) {
      const header = document.createElement('div');
      header.className = 'loc-section-header';
      header.textContent = 'STATES';
      locResults.appendChild(header);
      matchedStates.forEach(s => {
        const item = document.createElement('div');
        item.className = 'loc-item';
        if (filters.location && filters.location.type === 'state' && filters.location.name === s.name) {
          item.classList.add('selected');
        }
        item.innerHTML = `<span class="loc-item-name">${s.name}</span><span class="loc-item-count">${s.count}</span>`;
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          if (filters.location && filters.location.type === 'state' && filters.location.name === s.name) {
            filters.location = null;
          } else {
            filters.location = { type: 'state', name: s.name };
          }
          closeAllPopovers();
          render();
        });
        locResults.appendChild(item);
      });
    }

    if (matchedCities.length > 0) {
      const header = document.createElement('div');
      header.className = 'loc-section-header';
      header.textContent = 'CITIES';
      locResults.appendChild(header);
      matchedCities.forEach(c => {
        const item = document.createElement('div');
        item.className = 'loc-item';
        if (filters.location && filters.location.type === 'city' && filters.location.name === c.name) {
          item.classList.add('selected');
        }
        item.innerHTML = `<span class="loc-item-name">${c.name}</span><span class="loc-item-count">${c.count}</span>`;
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          if (filters.location && filters.location.type === 'city' && filters.location.name === c.name) {
            filters.location = null;
          } else {
            filters.location = { type: 'city', name: c.name, stateAbbr: c.state };
          }
          closeAllPopovers();
          render();
        });
        locResults.appendChild(item);
      });
    }

    if (matchedStates.length === 0 && matchedCities.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'loc-empty';
      empty.textContent = 'No locations found';
      locResults.appendChild(empty);
    }

    if (filters.location) {
      const clearItem = document.createElement('div');
      clearItem.className = 'loc-clear-item';
      clearItem.textContent = 'Clear location';
      clearItem.addEventListener('click', (e) => {
        e.stopPropagation();
        filters.location = null;
        closeAllPopovers();
        render();
      });
      locResults.appendChild(clearItem);
    }
  }

  locSearchInput.addEventListener('input', () => renderLocResults(locSearchInput.value));

  locSeg.appendChild(locPopover);

  locSeg.addEventListener('click', (e) => {
    e.stopPropagation();
    if (activePopover === locPopover) {
      closeAllPopovers();
      return;
    }
    closeAllPopovers();
    locPopover.classList.add('open');
    if (isMobile()) backdrop.classList.add('open');
    activePopover = locPopover;
    activePopoverTrigger = locSeg;
    renderLocResults(locSearchInput.value);
    setTimeout(() => locSearchInput.focus(), 50);
  });

  filterRow.appendChild(locSeg);

  // Separator
  addSep();

  // Price segment
  const priceSeg = makeFilterSegment(
    filters.price ? filters.priceLabel : 'Any price',
    filters.price !== null,
    priceOptions.map(o => ({
      label: o.label,
      selected: filters.price === o.value && filters.priceLabel === o.label,
      onSelect: () => {
        filters.price = o.value;
        filters.priceLabel = o.value ? o.label : null;
        closeAllPopovers();
        render();
      }
    }))
  );
  filterRow.appendChild(priceSeg);

  addSep();

  // Platform segment
  const platSeg = makeFilterSegment(
    filters.platform || 'Any platform',
    filters.platform !== null,
    platformOptions.map(o => ({
      label: o.label,
      selected: filters.platform === o.value,
      onSelect: () => {
        filters.platform = o.value;
        closeAllPopovers();
        render();
      }
    }))
  );
  filterRow.appendChild(platSeg);

  addSep();

  // Sleeps segment
  const sleepSeg = makeFilterSegment(
    filters.sleeps ? `Sleeps ${filters.sleeps}+` : 'Sleeps any',
    filters.sleeps !== null,
    sleepsOptions.map(o => ({
      label: o.label,
      selected: filters.sleeps === o.value,
      onSelect: () => {
        filters.sleeps = o.value;
        closeAllPopovers();
        render();
      }
    }))
  );
  filterRow.appendChild(sleepSeg);

  // Clear all link
  const hasFilters = filters.location || filters.price || filters.platform || filters.sleeps || filters.editorsPick || filters.isNew;
  const clearAll = document.createElement('span');
  clearAll.className = 'filter-clear-all' + (hasFilters ? ' visible' : '');
  clearAll.textContent = 'clear';
  clearAll.addEventListener('click', () => {
    filters.location = null;
    filters.price = null;
    filters.priceLabel = null;
    filters.platform = null;
    filters.sleeps = null;
    filters.editorsPick = false;
    filters.isNew = false;
    render();
  });
  filterRow.appendChild(clearAll);

  // Toggle badges
  const badges = document.createElement('span');
  badges.className = 'filter-badges';

  const pickBadge = document.createElement('span');
  pickBadge.className = 'toggle-badge pick' + (filters.editorsPick ? ' pressed' : '');
  pickBadge.innerHTML = '&#10022; Pick';
  pickBadge.addEventListener('click', () => {
    filters.editorsPick = !filters.editorsPick;
    render();
  });
  badges.appendChild(pickBadge);

  const newBadge = document.createElement('span');
  newBadge.className = 'toggle-badge new-badge' + (filters.isNew ? ' pressed' : '');
  newBadge.textContent = 'New';
  newBadge.addEventListener('click', () => {
    filters.isNew = !filters.isNew;
    render();
  });
  badges.appendChild(newBadge);

  filterRow.appendChild(badges);

  function addSep() {
    const sep = document.createElement('span');
    sep.className = 'filter-sep';
    sep.textContent = '·';
    filterRow.appendChild(sep);
  }
}

function makeFilterSegment(label, isActive, options) {
  const seg = document.createElement('span');
  seg.className = 'filter-seg' + (isActive ? ' active' : '');
  seg.style.position = 'relative';

  const text = document.createElement('span');
  text.className = 'filter-seg-text';
  text.textContent = label;
  seg.appendChild(text);

  const popover = document.createElement('div');
  popover.className = 'filter-popover';

  if (isMobile()) {
    const handle = document.createElement('div');
    handle.className = 'sheet-handle';
    popover.appendChild(handle);
  }

  options.forEach(o => {
    const item = document.createElement('div');
    item.className = 'fp-item' + (o.selected ? ' selected' : '');
    item.textContent = o.label;
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      o.onSelect();
    });
    popover.appendChild(item);
  });

  seg.appendChild(popover);

  seg.addEventListener('click', (e) => {
    e.stopPropagation();
    if (activePopover === popover) {
      closeAllPopovers();
      return;
    }
    closeAllPopovers();
    popover.classList.add('open');
    if (isMobile()) backdrop.classList.add('open');
    activePopover = popover;
    activePopoverTrigger = seg;
  });

  return seg;
}

// ── Render cards ──
function renderCards(filtered, animate) {
  const existing = resultsGrid.querySelectorAll('.card');

  if (animate && existing.length > 0) {
    // Exit animation
    existing.forEach(c => c.classList.add('exiting'));
    setTimeout(() => {
      swapCards(filtered, true);
    }, 150);
  } else {
    swapCards(filtered, animate);
  }
}

function swapCards(filtered, animate) {
  resultsGrid.innerHTML = '';

  if (filtered.length === 0) {
    resultsGrid.style.display = 'none';
    emptyState.classList.add('visible');
    return;
  }

  resultsGrid.style.display = '';
  emptyState.classList.remove('visible');

  filtered.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = 'card' + (animate ? ' entering' : '');
    const cat = s.category;
    const platformLower = s.platform.toLowerCase();

    card.innerHTML = `
      <div class="card-image">
        <div class="card-image-gradient ${cat}"></div>
        <span class="card-category-stamp">${cat}</span>
        <span class="card-postmark">${s.stateAbbr}</span>
        ${s.editorsPick ? '<span class="card-pick-stamp">&#10022;</span>' : ''}
      </div>
      <div class="card-body">
        <div class="card-title">${s.title}</div>
        <div class="card-location">${s.location}</div>
        <div class="card-meta">$${s.price}/nt &middot; sleeps ${s.sleeps} &middot; &#9733; ${s.rating}</div>
        <div class="card-platform"><span class="platform-dot ${platformLower}"></span>${s.platform}</div>
      </div>
    `;

    resultsGrid.appendChild(card);

    if (animate) {
      const delay = Math.min(i * 40, 400);
      setTimeout(() => {
        card.classList.remove('entering');
        card.classList.add('entered');
        // Re-apply nth-child rotation after entering
        const idx = i + 1;
        if (idx % 3 === 1) card.style.transform = 'rotate(-1.5deg)';
        else if (idx % 3 === 2) card.style.transform = 'rotate(0.8deg)';
        else card.style.transform = 'rotate(-0.5deg)';
      }, delay);
    }
  });
}

// ── Update count ──
function updateCount(count) {
  stayCountEl.textContent = `${count} ${count === 1 ? 'stay' : 'stays'}`;
}

// ── Main render ──
function render(animate) {
  const filtered = getFilteredStays();
  updateCount(filtered.length);
  renderCategories();
  renderFilterSentence();
  renderCards(filtered, animate);
}

// ── Search ──
searchInput.addEventListener('input', () => {
  filters.search = searchInput.value.trim();
  searchClear.classList.toggle('visible', searchInput.value.length > 0);
  compassIcon.classList.toggle('active', searchInput.value.length > 0);
  render(true);
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  filters.search = '';
  searchClear.classList.remove('visible');
  compassIcon.classList.remove('active');
  searchInput.focus();
  render(true);
});

// ── Empty state reset ──
emptyReset.addEventListener('click', () => {
  filters.search = '';
  filters.category = 'all';
  filters.location = null;
  filters.price = null;
  filters.priceLabel = null;
  filters.platform = null;
  filters.sleeps = null;
  filters.editorsPick = false;
  filters.isNew = false;
  searchInput.value = '';
  searchClear.classList.remove('visible');
  compassIcon.classList.remove('active');
  render(true);
});

// ── Close popovers on outside click ──
document.addEventListener('click', (e) => {
  if (activePopover && !activePopover.contains(e.target) && activePopoverTrigger && !activePopoverTrigger.contains(e.target)) {
    closeAllPopovers();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeAllPopovers();
});

backdrop.addEventListener('click', closeAllPopovers);

// ── Init ──
render(false);
</script>
